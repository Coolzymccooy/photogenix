
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PhotoGenix AI Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'], // Rule 4.1: Expressive technical font
            },
            borderRadius: {
              'none': '0',
              'sm': '2px', // Rule 6.1: Shape restraint - very subtle rounding
              DEFAULT: '4px',
              'md': '6px', 
              'lg': '8px',
              'xl': '12px',
            },
            colors: {
              // Rule 3.1: Strict role-based palette
              base: '#09090b', // Zinc 950 (Background)
              surface: '#18181b', // Zinc 900 (Cards/Panels)
              signal: '#6366f1', // Indigo 500 (Interaction/Focus)
              line: '#27272a', // Zinc 800 (Borders)
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
      /* Technical Scrollbar */
      ::-webkit-scrollbar {
        width: 4px;
        height: 4px;
      }
      ::-webkit-scrollbar-track {
        background: #09090b; 
      }
      ::-webkit-scrollbar-thumb {
        background: #3f3f46; 
        border-radius: 0px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #6366f1; /* Signal color on hover */
      }
      .custom-scrollbar::-webkit-scrollbar {
        height: 4px;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      
      /* Rule 7.2: Timing Discipline - fast, mechanical easing */
      .transition-all {
        transition-duration: 150ms;
        transition-timing-function: cubic-bezier(0.25, 0.46, 0.45, 0.94);
      }
      
      /* Scanline effect for "Active" feel */
      .scanline {
        background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.1));
        background-size: 100% 4px;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.33.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.561.0",
    "jszip": "https://esm.sh/jszip@^3.10.1",
    "exifr": "https://esm.sh/exifr@^7.1.3"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-base text-zinc-300 font-sans antialiased selection:bg-signal selection:text-white">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
